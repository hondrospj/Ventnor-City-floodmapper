name: Build lossless flood overlay WebP

on:
  push:
    branches: [main]
    paths:
      - tools/build_all_overlay_webp.py
      - .github/workflows/convert-overlay-webp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python tools/build_all_overlay_webp.py
      - name: Commit WebP overlays
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets
          if ! git diff --cached --quiet; then
            git commit -m 'Add lossless WebP flood overlays'
            git push
          fi
