name: Update Ventnor City observed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-observed.yml
  schedule:
    - cron: "37 4,5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ventnor-city-floodmapper-data-updates-v2
  cancel-in-progress: false

jobs:
  update-observed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Build observed archives
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import http.client
          import json
          import math
          import os
          import random
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TOWN_NAME = "Ventnor City"
          IS_SPLIT = False
          DEFAULT_ZONE_ID = "default"
          ZONES = [
            {
              "id": "default",
              "zoneName": "Ventnor City",
              "label": "Ventnor City",
              "gaugeName": "Inside Thorofare at Atlantic City",
              "petssGaugeId": "8534836",
              "usgsGaugeId": "01410560",
              "noaaGaugeId": "8534720",
              "observedSource": "usgs",
              "navd88OffsetFromMllwFt": -2.39,
              "thresholdsMllw": {
                "minorLow": 5.6,
                "moderateLow": 6.6,
                "majorLow": 7.6
              },
              "thresholdsNavd88": {
                "minorLow": 3.21,
                "moderateLow": 4.21,
                "majorLow": 5.21
              }
            }
          ]
          PARAMETER_CD = "72279"
          LOCAL_TIME_ZONE = "America/New_York"
          LOCAL_ZONE = ZoneInfo(LOCAL_TIME_ZONE)
          ARCHIVE_START_DATE = "2007-10-01"
          PRIMARY_PATH = Path("observed.json")
          OVERFLOW_PATH = Path("observedoverflow.json")
          TOP_TIDES_PATH = Path("toptides.json")
          USGS_CRESTS_PATH = Path("usgs_crests.json")
          CHUNK_DAYS = 31
          TOP_TIDE_LIMIT = 10

          def fetch_json(url):
              last_error = None
              for attempt in range(1, 6):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": f"{TOWN_NAME}-floodmapper/2.0"})
                      with urllib.request.urlopen(req, timeout=180) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {429, 500, 502, 503, 504}:
                          raise
                      last_error = exc
                  except (urllib.error.URLError, http.client.IncompleteRead, TimeoutError, OSError, ValueError) as exc:
                      last_error = exc
                  if attempt == 5:
                      raise last_error
                  delay = min(30.0, 2 ** attempt) + random.random() * 2.0
                  print(f"Transient data fetch failure ({last_error}); retry {attempt}/5 in {delay:.1f}s")
                  time.sleep(delay)

          def round_hundredth(value):
              return round(float(value) + 1e-9, 2)

          def local_hour_key(dt_utc):
              local = dt_utc.astimezone(LOCAL_ZONE).replace(minute=0, second=0, microsecond=0)
              return local.date().isoformat(), local.hour

          def local_iso(dt_utc):
              local = dt_utc.astimezone(LOCAL_ZONE).replace(minute=0, second=0, microsecond=0)
              return local.strftime("%Y-%m-%dT%H:00")

          def classify_peak(peak, thresholds):
              if peak is None or not math.isfinite(peak):
                  return "none"
              if peak >= thresholds["majorLow"]:
                  return "major"
              if peak >= thresholds["moderateLow"]:
                  return "moderate"
              if peak >= thresholds["minorLow"]:
                  return "minor"
              return "none"

          def usgs_url(zone, start_dt, end_dt):
              params = {
                  "format": "json",
                  "sites": zone["usgsGaugeId"],
                  "parameterCd": PARAMETER_CD,
                  "startDT": start_dt.isoformat().replace("+00:00", "Z"),
                  "endDT": end_dt.isoformat().replace("+00:00", "Z"),
                  "siteStatus": "all",
              }
              return "https://waterservices.usgs.gov/nwis/iv/?" + urllib.parse.urlencode(params)

          def noaa_url(zone, start_dt, end_dt):
              params = {
                  "begin_date": start_dt.strftime("%Y%m%d %H:%M"),
                  "end_date": end_dt.strftime("%Y%m%d %H:%M"),
                  "station": zone["noaaGaugeId"],
                  "product": "water_level",
                  "datum": "MLLW",
                  "time_zone": "gmt",
                  "units": "english",
                  "format": "json",
                  "application": "shorelysafe_floodmapper",
              }
              return "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?" + urllib.parse.urlencode(params)

          def fetch_usgs_hourly(zone, start_dt, end_dt):
              url = usgs_url(zone, start_dt, end_dt)
              data = fetch_json(url)
              hourly = {}
              for series in data.get("value", {}).get("timeSeries", []):
                  for bucket in series.get("values", []):
                      for item in bucket.get("value", []):
                          try:
                              stage = round_hundredth(item.get("value"))
                              dt_utc = datetime.fromisoformat(str(item.get("dateTime")).replace("Z", "+00:00")).astimezone(timezone.utc)
                          except Exception:
                              continue
                          key = local_hour_key(dt_utc)
                          old = hourly.get(key)
                          if old is None or stage > old["navd88StageFt"]:
                              hourly[key] = make_hour_record(key, dt_utc, stage, round_hundredth(stage - zone["navd88OffsetFromMllwFt"]))
              return hourly, url

          def fetch_noaa_hourly(zone, start_dt, end_dt):
              url = noaa_url(zone, start_dt, end_dt)
              data = fetch_json(url)
              if data.get("error"):
                  raise RuntimeError(f"NOAA error for {zone['id']}: {data['error']}")
              hourly = {}
              for item in data.get("data", []):
                  try:
                      mllw = round_hundredth(item.get("v"))
                      dt_utc = datetime.strptime(item["t"], "%Y-%m-%d %H:%M").replace(tzinfo=timezone.utc)
                      stage = round_hundredth(mllw + zone["navd88OffsetFromMllwFt"])
                  except Exception:
                      continue
                  key = local_hour_key(dt_utc)
                  old = hourly.get(key)
                  if old is None or stage > old["navd88StageFt"]:
                      hourly[key] = make_hour_record(key, dt_utc, stage, mllw)
              return hourly, url

          def make_hour_record(key, dt_utc, navd88, mllw):
              return {
                  "hourIndex": key[1],
                  "timeUtc": dt_utc.replace(minute=0, second=0, microsecond=0).isoformat().replace("+00:00", "Z"),
                  "timeLocal": local_iso(dt_utc),
                  "timeEST": local_iso(dt_utc),
                  "displayTimeEST": local_iso(dt_utc),
                  "navd88StageFt": navd88,
                  "mllwStageFt": mllw,
              }

          def fetch_hourly(zone, start_dt, end_dt):
              if zone.get("observedSource") == "noaa":
                  return fetch_noaa_hourly(zone, start_dt, end_dt)
              return fetch_usgs_hourly(zone, start_dt, end_dt)

          def day_record(zone, date_str, hourly_records):
              hours = [hourly_records[(date_str, h)] for h in range(24) if (date_str, h) in hourly_records]
              if not hours:
                  return None
              peak = round_hundredth(max(h["navd88StageFt"] for h in hours))
              return {
                  "date": date_str,
                  "classification": classify_peak(peak, zone["thresholdsNavd88"]),
                  "peakNAVD88": peak,
                  "peakMLLW": round_hundredth(peak - zone["navd88OffsetFromMllwFt"]),
                  "hours": hours,
              }

          def empty_zone_payload(zone, now_utc, archive_end):
              return {
                  "zoneId": zone["id"],
                  "zoneName": zone["zoneName"],
                  "gaugeName": zone["gaugeName"],
                  "site": zone["noaaGaugeId"] if zone.get("observedSource") == "noaa" else zone["usgsGaugeId"],
                  "petssGaugeId": zone["petssGaugeId"],
                  "noaaGaugeId": zone["noaaGaugeId"],
                  "parameterCd": PARAMETER_CD if zone.get("observedSource") == "usgs" else "",
                  "datum": "NAVD88",
                  "timeZone": LOCAL_TIME_ZONE,
                  "method": "hourly_max_operational_record_incremental_v3",
                  "lastProcessedISO": now_utc.replace(microsecond=0).isoformat().replace("+00:00", "Z"),
                  "archiveStartDate": ARCHIVE_START_DATE,
                  "archiveEndDate": archive_end,
                  "navd88OffsetFromMllwFt": zone["navd88OffsetFromMllwFt"],
                  "thresholdsMLLW": zone["thresholdsMllw"],
                  "thresholdsNAVD88": zone["thresholdsNavd88"],
                  "sourceType": "NOAA_COOPS_water_level_hourly_max_MLLW_converted_to_NAVD88" if zone.get("observedSource") == "noaa" else "USGS_NWIS_instantaneous_values_hourly_max",
                  "days": [],
              }

          def build_full_archive(zone, now_utc):
              archive_start = datetime.strptime(ARCHIVE_START_DATE, "%Y-%m-%d").date()
              archive_end = now_utc.astimezone(LOCAL_ZONE).date()
              hourly = {}
              cur = archive_start
              last_url = ""
              while cur <= archive_end:
                  end = min(cur + timedelta(days=CHUNK_DAYS - 1), archive_end)
                  start_utc = datetime.combine(cur, datetime.min.time(), tzinfo=LOCAL_ZONE).astimezone(timezone.utc)
                  end_utc = datetime.combine(end + timedelta(days=1), datetime.min.time(), tzinfo=LOCAL_ZONE).astimezone(timezone.utc) - timedelta(seconds=1)
                  chunk, last_url = fetch_hourly(zone, start_utc, end_utc)
                  hourly.update(chunk)
                  cur = end + timedelta(days=1)
              days = []
              cur = archive_start
              while cur <= archive_end:
                  rec = day_record(zone, cur.isoformat(), hourly)
                  if rec:
                      days.append(rec)
                  cur += timedelta(days=1)
              payload = empty_zone_payload(zone, now_utc, archive_end.isoformat())
              payload["days"] = days
              payload["sourceUrlTemplate"] = last_url
              payload["fullArchiveBuiltISO"] = now_utc.replace(microsecond=0).isoformat().replace("+00:00", "Z")
              return payload

          def format_display_date(date_str):
              try:
                  dt = datetime.strptime(str(date_str), "%Y-%m-%d")
              except Exception:
                  return str(date_str or "")
              return dt.strftime("%b %-d, %Y")

          def day_peak_navd88(day):
              try:
                  value = float(day.get("peakNAVD88"))
                  if math.isfinite(value):
                      return value
              except Exception:
                  pass
              values = []
              for hour in day.get("hours") or []:
                  try:
                      value = float(hour.get("navd88StageFt"))
                      if math.isfinite(value):
                          values.append(value)
                  except Exception:
                      continue
              return max(values) if values else None

          def day_peak_mllw(day, zone, peak_navd88):
              try:
                  value = float(day.get("peakMLLW"))
                  if math.isfinite(value):
                      return value
              except Exception:
                  pass
              if peak_navd88 is None:
                  return None
              return round_hundredth(peak_navd88 - zone["navd88OffsetFromMllwFt"])

          def load_official_crest_rows(zone):
              if not USGS_CRESTS_PATH.exists():
                  raise RuntimeError(f"Official USGS crest catalog is missing: {USGS_CRESTS_PATH}")
              data = json.loads(USGS_CRESTS_PATH.read_text(encoding="utf-8"))
              zone_data = (data.get("zones") or {}).get(zone["id"], {})
              rows = []
              for item in zone_data.get("crests") or []:
                  try:
                      height = float(item.get("height_navd88_ft", item.get("height_ft")))
                  except Exception:
                      continue
                  date = str(item.get("date", ""))[:10]
                  if not date or not math.isfinite(height):
                      continue
                  row = copy.deepcopy(item)
                  row["height_ft"] = round_hundredth(height)
                  row["height_navd88_ft"] = round_hundredth(height)
                  row["zoneId"] = zone["id"]
                  row["zoneLabel"] = zone["label"]
                  row["gaugeName"] = zone["gaugeName"]
                  row["officialCrestOverride"] = True
                  rows.append(row)
              if not rows:
                  raise RuntimeError(f"Official USGS crest catalog has no rows for {zone['id']}")
              return rows

          def merge_official_crest_rows(zone, observed_rows):
              observed_by_date = {}
              for row in observed_rows or []:
                  if row.get("officialCrestOverride"):
                      continue
                  date = str(row.get("date", ""))[:10]
                  try:
                      height = float(row.get("height_navd88_ft", row.get("height_ft")))
                  except Exception:
                      continue
                  if not date or not math.isfinite(height):
                      continue
                  previous = observed_by_date.get(date)
                  if previous is None or height > previous[0]:
                      observed_by_date[date] = (height, copy.deepcopy(row))
              observed = [row for _, row in sorted(observed_by_date.values(), key=lambda item: item[0], reverse=True)[:TOP_TIDE_LIMIT]]
              authoritative = {str(row.get("date", ""))[:10]: row for row in load_official_crest_rows(zone)}
              combined = [row for row in observed if str(row.get("date", ""))[:10] not in authoritative]
              combined.extend(authoritative.values())
              combined.sort(key=lambda row: (float(row.get("height_navd88_ft", row.get("height_ft"))), str(row.get("date", ""))), reverse=True)
              for rank, row in enumerate(combined, 1):
                  row["rank"] = rank
                  row["zoneId"] = zone["id"]
                  row["zoneLabel"] = zone["label"]
                  row["gaugeName"] = zone["gaugeName"]
              return combined

          def top_tide_rows(zone, payload):
              rows = []
              seen_dates = set()
              candidates = []
              for day in payload.get("days") or []:
                  date = str(day.get("date", ""))[:10]
                  if not date or date in seen_dates:
                      continue
                  peak_navd88 = day_peak_navd88(day)
                  if peak_navd88 is None or not math.isfinite(peak_navd88):
                      continue
                  peak_mllw = day_peak_mllw(day, zone, peak_navd88)
                  candidates.append((peak_navd88, date, peak_mllw, day))
                  seen_dates.add(date)
              for rank, (peak_navd88, date, peak_mllw, day) in enumerate(sorted(candidates, reverse=True)[:TOP_TIDE_LIMIT], 1):
                  rows.append({
                      "rank": rank,
                      "height_ft": round_hundredth(peak_navd88),
                      "height_navd88_ft": round_hundredth(peak_navd88),
                      "height_mllw_ft": round_hundredth(peak_mllw) if peak_mllw is not None else None,
                      "date": date,
                      "display_date": format_display_date(date),
                      "zoneId": zone["id"],
                      "zoneLabel": zone["label"],
                      "gaugeName": zone["gaugeName"],
                      "source": "observed-archive",
                  })
              return merge_official_crest_rows(zone, rows)

          def load_existing_zone(zone):
              candidates = []
              existing_site = ""
              for path in [PRIMARY_PATH, OVERFLOW_PATH]:
                  if not path.exists():
                      continue
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if data.get("zones"):
                      source_payload = data.get("zones", {}).get(zone["id"], {}).get("observed")
                      if source_payload:
                          candidates.extend(source_payload.get("days") or [])
                          if not existing_site:
                              existing_site = str(source_payload.get("site", ""))
                  else:
                      candidates.extend(data.get("days") or [])
                      if not existing_site:
                          existing_site = str(data.get("site", ""))
              if not candidates:
                  return None
              days = sorted(candidates, key=lambda d: str(d.get("date", "")))
              payload = empty_zone_payload(zone, datetime.now(timezone.utc), days[-1].get("date", ARCHIVE_START_DATE))
              payload["site"] = existing_site
              payload["days"] = days
              payload["fullArchiveBuiltISO"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              return payload

          def existing_matches_zone(payload, zone):
              if not payload or not payload.get("days"):
                  return False
              expected_site = str(zone["noaaGaugeId"] if zone.get("observedSource") == "noaa" else zone["usgsGaugeId"])
              if str(payload.get("site", "")) != expected_site:
                  return False
              expected_offset = float(zone["navd88OffsetFromMllwFt"])
              days = payload.get("days") or []
              sample_indexes = sorted({0, len(days) // 2, len(days) - 1})
              for index in sample_indexes:
                  if index < 0 or index >= len(days):
                      continue
                  day = days[index]
                  hours = day.get("hours") if isinstance(day, dict) else []
                  if not isinstance(hours, list) or not hours:
                      continue
                  hour_indexes = sorted({0, len(hours) // 2, len(hours) - 1})
                  for hour_index in hour_indexes:
                      hour = hours[hour_index]
                      try:
                          navd88 = float(hour["navd88StageFt"])
                          mllw = float(hour["mllwStageFt"])
                      except (KeyError, TypeError, ValueError):
                          continue
                      if abs(mllw - (navd88 - expected_offset)) > 0.011:
                          return False
                  if day.get("classification") and day.get("classification") != classify_peak(day.get("peakNAVD88"), zone["thresholdsNavd88"]):
                      return False
              return True

          def merge_recent(zone, payload, now_utc):
              archive_end = now_utc.astimezone(LOCAL_ZONE).date()
              existing_dates = []
              for day in payload.get("days", []):
                  try:
                      existing_dates.append(datetime.strptime(str(day.get("date", ""))[:10], "%Y-%m-%d").date())
                  except Exception:
                      continue
              latest_existing = max(existing_dates) if existing_dates else archive_end - timedelta(days=2)
              # Re-fetch the latest stored day so a partial final day is completed,
              # then cover every missing day. A fixed 48-hour window silently left
              # archive gaps whenever Actions had been paused for longer than that.
              cur = max(datetime.strptime(ARCHIVE_START_DATE, "%Y-%m-%d").date(), latest_existing)
              hourly = {}
              last_url = ""
              while cur <= archive_end:
                  end = min(cur + timedelta(days=CHUNK_DAYS - 1), archive_end)
                  start_utc = datetime.combine(cur, datetime.min.time(), tzinfo=LOCAL_ZONE).astimezone(timezone.utc)
                  end_utc = datetime.combine(end + timedelta(days=1), datetime.min.time(), tzinfo=LOCAL_ZONE).astimezone(timezone.utc) - timedelta(seconds=1)
                  chunk, last_url = fetch_hourly(zone, start_utc, min(end_utc, now_utc))
                  hourly.update(chunk)
                  cur = end + timedelta(days=1)
              day_map = {str(day.get("date")): day for day in payload.get("days", []) if isinstance(day, dict) and day.get("date")}
              for date_str in sorted({key[0] for key in hourly}):
                  combined = {}
                  existing = day_map.get(date_str)
                  if existing and isinstance(existing.get("hours"), list):
                      for hour in existing["hours"]:
                          try:
                              h = int(hour.get("hourIndex"))
                          except Exception:
                              continue
                          if 0 <= h <= 23:
                              combined[(date_str, h)] = hour
                  for key, value in hourly.items():
                      if key[0] == date_str:
                          combined[key] = value
                  rec = day_record(zone, date_str, combined)
                  if rec:
                      day_map[date_str] = rec
              days = [day_map[key] for key in sorted(day_map.keys())]
              payload.update(empty_zone_payload(zone, now_utc, days[-1]["date"] if days else now_utc.astimezone(LOCAL_ZONE).date().isoformat()))
              payload["days"] = days
              payload["sourceUrlTemplate"] = last_url
              payload["lastIncrementalUpdateISO"] = now_utc.replace(microsecond=0).isoformat().replace("+00:00", "Z")
              return payload

          def zone_payload(zone, now_utc):
              existing = load_existing_zone(zone)
              if existing_matches_zone(existing, zone):
                  return merge_recent(zone, existing, now_utc)
              return build_full_archive(zone, now_utc)

          def year_split(archive_start, archive_end):
              years = list(range(archive_start.year, archive_end.year + 1))
              cut = len(years) // 2
              overflow_years = set(years[:cut])
              primary_years = set(years[cut:])
              return overflow_years, primary_years, min(primary_years)

          def split_days(days, overflow_years, primary_years):
              overflow = []
              primary = []
              for day in days:
                  try:
                      year = int(str(day.get("date", ""))[:4])
                  except Exception:
                      continue
                  if year in overflow_years:
                      overflow.append(day)
                  elif year in primary_years:
                      primary.append(day)
              return overflow, primary

          def with_days(payload, days, part, contains, split_year):
              out = copy.deepcopy(payload)
              dates = sorted(str(day.get("date", ""))[:10] for day in days if str(day.get("date", ""))[:10])
              out["days"] = days
              if dates:
                  out["archiveStartDate"] = dates[0]
                  out["archiveEndDate"] = dates[-1]
              out["splitPart"] = part
              out["splitContains"] = contains
              out["splitYear"] = split_year
              return out

          def main():
              now_utc = datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
              if os.environ.get("GITHUB_EVENT_NAME") == "schedule" and now_utc.astimezone(LOCAL_ZONE).hour != 0:
                  print("Not midnight in local time; no observed update needed.")
                  return
              if not IS_SPLIT:
                  zone = ZONES[0]
                  payload = zone_payload(zone, now_utc)
                  top_tides = {
                      "generatedAt": now_utc.isoformat().replace("+00:00", "Z"),
                      "schema": "single-zone-top-tides-v1",
                      "town": TOWN_NAME,
                      "toptides": top_tide_rows(zone, payload),
                  }
                  payload.pop("zoneId", None)
                  payload.pop("zoneName", None)
                  PRIMARY_PATH.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
                  TOP_TIDES_PATH.write_text(json.dumps(top_tides, indent=2) + "\n", encoding="utf-8")
                  print("Wrote", PRIMARY_PATH, "days", len(payload.get("days", [])))
                  print("Wrote", TOP_TIDES_PATH, "rows", len(top_tides["toptides"]))
                  return
              archive_start = datetime.strptime(ARCHIVE_START_DATE, "%Y-%m-%d").date()
              archive_end = now_utc.astimezone(LOCAL_ZONE).date()
              overflow_years, primary_years, split_year = year_split(archive_start, archive_end)
              primary = {"town": TOWN_NAME, "defaultZoneId": DEFAULT_ZONE_ID, "schema": "multi-zone-observed-v1", "lastProcessedISO": now_utc.isoformat().replace("+00:00", "Z"), "splitArchive": {"part": "primary", "contains": f"{min(primary_years)}-{max(primary_years)}", "splitYear": split_year, "companion": str(OVERFLOW_PATH)}, "zones": {}}
              overflow = {"town": TOWN_NAME, "defaultZoneId": DEFAULT_ZONE_ID, "schema": "multi-zone-observed-v1", "lastProcessedISO": now_utc.isoformat().replace("+00:00", "Z"), "splitArchive": {"part": "overflow", "contains": f"{min(overflow_years)}-{max(overflow_years)}", "splitYear": split_year, "companion": str(PRIMARY_PATH)}, "zones": {}}
              top_tides = {"town": TOWN_NAME, "defaultZoneId": DEFAULT_ZONE_ID, "schema": "multi-zone-top-tides-v1", "generatedAt": now_utc.isoformat().replace("+00:00", "Z"), "zones": {}}
              for zone in ZONES:
                  payload = zone_payload(zone, now_utc)
                  older, newer = split_days(payload.get("days", []), overflow_years, primary_years)
                  primary["zones"][zone["id"]] = {"label": zone["label"], "gaugeName": zone["gaugeName"], "observed": with_days(payload, newer, "primary", "newer-years", split_year)}
                  overflow["zones"][zone["id"]] = {"label": zone["label"], "gaugeName": zone["gaugeName"], "observed": with_days(payload, older, "overflow", "older-years", split_year)}
                  top_tides["zones"][zone["id"]] = {"label": zone["label"], "gaugeName": zone["gaugeName"], "toptides": top_tide_rows(zone, payload)}
                  print(zone["id"], "days", len(payload.get("days", [])))
              PRIMARY_PATH.write_text(json.dumps(primary, indent=2) + "\n", encoding="utf-8")
              OVERFLOW_PATH.write_text(json.dumps(overflow, indent=2) + "\n", encoding="utf-8")
              TOP_TIDES_PATH.write_text(json.dumps(top_tides, indent=2) + "\n", encoding="utf-8")
              print("Wrote", PRIMARY_PATH, "and", OVERFLOW_PATH)
              print("Wrote", TOP_TIDES_PATH)

          if __name__ == "__main__":
              main()
          PY

      - name: Commit updated observed archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add observed.json observedoverflow.json toptides.json 2>/dev/null || git add observed.json toptides.json
          git diff --staged --quiet || git commit -m "Update Ventnor City observed"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 pull/rebase retries." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
