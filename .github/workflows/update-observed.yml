name: Update Ventnor City observed archives

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-observed.yml
      - tools/update_observed_15min.py
      - tools/update_historic_crests.py
      - tools/build_observed_archive_shards.py
      - floodmapper_v2.json
  schedule:
    - cron: "37 4,5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ventnor-city-observed-v2
  cancel-in-progress: false

jobs:
  update-observed:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Update primary USGS continuous archive
        if: ${{ hashFiles('tools/update_observed_15min.py') != '' }}
        run: python3 tools/update_observed_15min.py --update-hourly
      - name: Update official USGS storm-tide crests
        run: python3 tools/update_historic_crests.py
      - name: Rebuild browser archive index and year shards
        run: python3 tools/build_observed_archive_shards.py
      - name: Commit changed archives
        shell: bash
        run: |
          paths=(observed.json observed15min.json toptides.json observed_archive_index.json observed_archive/stone-harbor)
          existing=()
          for path in "${paths[@]}"; do [ -e "$path" ] && existing+=("$path"); done
          if [ "${#existing[@]}" -eq 0 ] || git diff --quiet -- "${existing[@]}"; then
            echo "Observed archives and crests are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${existing[@]}"
          git commit -m "Update Ventnor City observed archives"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main
            if git push; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 3))
          done
